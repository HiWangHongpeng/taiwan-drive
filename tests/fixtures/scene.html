<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>場景固定檢視，非駕駛驗收</title><style>body{margin:0}p{position:fixed;top:8px;left:14px;background:#eef1e4df;color:#30463e;font:14px system-ui;padding:10px;border-radius:6px;z-index:2}</style><div id="world"></div><p>固定場景檢視 · 非連續駕駛證據</p><script type="module">
import * as T from 'three';import {View} from '/src/scene.ts';import {wheelContacts} from '/src/vehicle-grounding.ts';
const args=new URLSearchParams(location.search),world=await(await fetch('/data/world.json')).json(),route=world.routes[Number(args.get('direction')??0)];let i=0,d=0;while(i<route.length-2&&d<Number(args.get('metres')??500)){d+=Math.hypot(route[i+1][0]-route[i][0],route[i+1][2]-route[i][2]);i++;}const p=route[i],q=route[i+1],car={x:p[0],y:p[1],z:p[2],yaw:Math.atan2(q[0]-p[0],q[2]-p[2]),speed:0,travel:0,collisions:0,reverseHold:0};
const view=new View(document.querySelector('#world'),world,'standard');await view.loadVehicle();if(args.get('original'))view.selectVehicle(false);view.render(car,1/60,0);
const kind=args.get('view')??'side',offset=kind==='environment'?new T.Vector3(0,4,-8.5):kind==='rail'?new T.Vector3(3.6,1.2,-1.5):new T.Vector3(4.8,.8,4);offset.applyAxisAngle(new T.Vector3(0,1,0),car.yaw);view.camera.position.set(car.x+offset.x,view.vehicle.position.y+offset.y,car.z+offset.z);view.camera.fov=kind==='side'?48:65;view.camera.updateProjectionMatrix();view.camera.lookAt(car.x,view.vehicle.position.y+(kind==='environment'?1:.5),car.z);view.renderer.render(view.scene,view.camera);
const pivots=args.get('original')?view.vehicle.children[0].children.filter(n=>n.children.some(c=>c.type==='Group')):['WheelFrontL','WheelFrontR','WheelRearL','WheelRearR'].map(n=>view.vehicle.getObjectByName(n));
const contacts=wheelContacts(view.vehicle,pivots,args.get('original')?.34:.38400009518171924,(x,z)=>view.roadSurface.height(x,z)??view.ground.renderedHeight(x,z));
Object.defineProperty(window,'__inspection',{value:Object.freeze({snapshot:()=>JSON.parse(JSON.stringify({method:'Isolated View fixture; source map coordinates; estimated camera; not Game or driving evidence',car,metres:d,contacts,stats:view.performanceSnapshot()}))})});document.body.dataset.ready='true';
</script></html>
